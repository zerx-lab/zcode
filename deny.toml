# cargo-deny：依赖审计。跑 `cargo deny check`（CI 里是 `check all`）。

[graph]
# 七个目标全部纳入图，避免"只在某平台才引入的依赖"逃过审计。
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
all-features = true

[advisories]
yanked = "deny"
# 有必须临时豁免的公告时，在此写 RUSTSEC 编号并附上到期理由。
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93
# 允许列表是策略而非现状快照：尚未被任何依赖用到的许可不该刷警告。
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# 有明确替代方案的 crate 在这里挡住，理由写在 reason 里。
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
