<!doctype html><meta charset="utf-8">
<style>
body{background:#0d0d0d;color:#ddd;font:14px ui-monospace,monospace;margin:24px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.box{background:#141414;border:1px solid #262626;border-radius:10px;padding:18px;display:flex;justify-content:center;align-items:center;height:110px}
figcaption{text-align:center;margin-top:8px;color:#888}
h1{font-size:15px;font-weight:600;color:#aaa}
</style><h1>zcode mark (B)</h1>
<!-- 直接引用真源 SVG：内联副本必然和 zcode-mark.svg 走散，改色时只会改一半。 -->
<div class="grid">
<figure><div class="box"><img src="zcode-mark.svg" width="120" height="90" alt="zcode-mark"></div><figcaption>zcode-mark</figcaption></figure>
<figure><div class="box"><img src="zcode-mark-mono.svg" width="120" height="90" alt="zcode-mark-mono"></div><figcaption>zcode-mark-mono</figcaption></figure>
<figure><div class="box" style="background:#fafafa"><img src="zcode-mark.svg" width="120" height="90" alt="zcode-mark on light"></div><figcaption>on light</figcaption></figure>
</div>
