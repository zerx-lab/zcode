[workspace]
resolver = "3"
members = ["crates/*"]

# ── 所有成员共享的包元数据 ──────────────────────────────────────────────
# 成员 crate 一律写 `version.workspace = true` 等继承形式，绝不各自固定。
[workspace.package]
version = "0.1.0"
edition = "2024"
# 实际下限由依赖决定：libsqlite3-sys 0.38 的 build.rs 用 `cfg_select!`（Rust 1.95 稳定），
# 且它自己没声明 rust-version，Cargo 拦不住——降回 1.92 会让 MSRV job 直接编译失败。
rust-version = "1.95"
license = "AGPL-3.0-only"
repository = "https://github.com/zerx-lab/zcode"
homepage = "https://github.com/zerx-lab/zcode"
authors = ["zerx-lab"]
keywords = ["agent", "llm", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]

# ── 依赖版本单一事实来源 ────────────────────────────────────────────────
# 见 rule://rust-quality：成员 crate 只写 `dep.workspace = true`。
# 新增依赖先加到这里，再在成员 crate 引用；不在成员 crate 里固定不同版本。
[workspace.dependencies]
# workspace 内部 crate（path + version 双写，发布时才能解析到 crates.io）
zcode-agent = { path = "crates/agent", version = "0.1.0" }
zcode-ai = { path = "crates/ai", version = "0.1.0" }
zcode-catalog = { path = "crates/catalog", version = "0.1.0" }
zcode-protocol = { path = "crates/protocol", version = "0.1.0" }
zcode-schema = { path = "crates/schema", version = "0.1.0" }
zcode-stats = { path = "crates/stats", version = "0.1.0" }
zcode-text = { path = "crates/text", version = "0.1.0" }
zcode-tui = { path = "crates/tui", version = "0.1.0" }
zcode-utils = { path = "crates/utils", version = "0.1.0" }

# 外部依赖
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["bracketed-paste", "event-stream"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
# HMAC-SHA256：daemon 端点握手的双向挑战应答。不自己拼 ipad/opad——那是能静默出错的地方。
hmac = "0.13"
ignore = "0.4"
# 只开我们真正解码/编码的格式：默认 feature 会拖进 avif/exr/tiff 等一大票编解码器。
image = { version = "0.25", default-features = false, features = [
  "gif",
  "jpeg",
  "png",
  "rayon",
  "webp",
] }
# job control（Ctrl-Z suspend）与 CSI 6n 光标探测，仅 cfg(unix)。
# 不需要 signal-hook：SIGTSTP 停住进程，SIGCONT 后从 kill 的下一行继续，无需 handler。
libc = "0.2"
memchr = "2.8"
# CommonMark + GFM 解析器。选它而非 comrak：pull parser 不建 AST，渲染器可以边收
# 事件边攒 `Line`，省掉一整棵中间树；GFM 的表格/删除线/任务列表都在。
pulldown-cmark = { version = "0.13", default-features = false, features = [
  "simd",
] }
# 只作为排版原语（Buffer/Line/Span/Widget）使用；Terminal 由 zcode-tui 自己 fork，
# 理由见 plans/tui/modules.md。crossterm_0_29 必须显式开：default-features 关掉后
# ratatui-crossterm 不会自己选版本，且必须与直接依赖的 crossterm 同版本。
ratatui = { version = "0.30", default-features = false, features = [
  "crossterm_0_29",
  "layout-cache",
  "scrolling-regions",         # DECSTBM
  "underline-color",
  "unstable-backend-writer",   # backend_mut() -> &mut impl Write
  "unstable-rendered-line-info",
  "unstable-widget-ref",
] }
rayon = "1.12"
regex = "1.13"
# bundled：不依赖系统 sqlite，跨平台构建一致（本机 MSVC C 工具链已验证可编译）。
rusqlite = { version = "0.40", features = ["bundled"] }
# 语法高亮。与 oh-my-pi 同源（它的 crates/pi-natives/src/highlight.rs 也是 syntect
# 5.x）。`regex-fancy` 而非默认的 `regex-onig`：onig 要 C 工具链，纯 Rust 后端在
# 本仓的跨平台矩阵里省掉一整类构建失败。不开 `default-themes`——配色来自本仓主题
# 的 11 个 syntax* 键，syntect 自带的 .tmTheme 一个都用不上，白占约 1 MiB。
syntect = { version = "5.3", default-features = false, features = [
  "default-syntaxes",
  "regex-fancy",
] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
reqwest = { version = "0.13", default-features = false, features = [
  "charset",
  "form",
  "http2",
  "json",
  "rustls-no-provider",
  "stream",
  "system-proxy",
] }
# reqwest 的 `rustls` feature 会拖进 aws-lc-sys（本机无 NASM/CMake，构建必然失败）。
# 改用 `rustls-no-provider` + ring，由 `zcode_ai::http` 在建 Client 前安装 process default provider。
rustls = { version = "0.23", default-features = false, features = [
  "logging",
  "ring",
  "std",
  "tls12",
] }
serde = { version = "1.0", features = ["derive"] }
# raw_value：zcode-catalog 的两级惰性解析靠 `RawValue` 只切子串，不构造 6149 个 ModelSpec。
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.53", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
# 只开读路径：配置文件只读不写，`display` 会拖进 toml_writer。
toml = { version = "1.1", default-features = false, features = [
  "parse",
  "serde",
  "std",
] }
tracing = "0.1"
# 日志订阅器。TUI 活动期间 stdout 归渲染，日志一律另走 sink（见 rule://zcode-architecture）。
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
  "std",
] }
url = "2.5"
webbrowser = "1.2"
# 自己启用 ENABLE_VIRTUAL_TERMINAL_PROCESSING，不经 crossterm 的 supports_ansi()。
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
] }
zstd = "0.13"

# 仅测试用
mockito = "1.7"
tempfile = "3"
# 解析自己发出的 escape 字节并断言整屏网格；实现了 DECSTBM 滚动区。
vt100 = "0.16"

# ── lint 单一事实来源 ───────────────────────────────────────────────────
# 成员 crate 一律写 `[lints] workspace = true`，绝不另建一套。
[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
# FFI（Windows VT 启用、Unix job control）必须逐个 crate 显式 allow 并写 SAFETY 注释。
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# rule://rust-quality 的硬约束：库代码不得 panic，不得用 `as` 做数值转换。
# 测试内的 unwrap/expect/panic 由 clippy.toml 的 allow-*-in-tests 放行。
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
# 噪声大于收益的 pedantic 项
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

# ── 构建剖面 ────────────────────────────────────────────────────────────
[profile.dev]
# 只保留行号表：backtrace 仍可用，链接明显更快（Windows 上尤其）。
debug = "line-tables-only"

[profile.dev.package."*"]
# 依赖极少改动，优化后编译一次换全程更快的调试运行（TUI 渲染路径明显）。
opt-level = 2

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
