# 项目级 advisor 名册。与用户级 ~/.omp/agent/WATCHDOG.yml 一起加载：
# 同名 advisor 由项目覆盖用户，不同名则并存。这里刻意用新名字 Domain，
# 保留用户已有的 Architecture / Runtime 视角，只补它们按 instructions 明确不管的那块。
#
# 需要 advisor.enabled: true（当前由用户级 config.yml 提供，本项目不重复设置）。
# 未配置 model 时走 modelRoles.advisor，避免把别人没有的模型 id 写死进仓库。

instructions: |
  本仓库当前只有规范文件，没有 Cargo 项目。任何声称跑过 cargo/bun 的验证都要核实。
  规范类问题按「哪一份文件该负责」给结论，不要泛泛说"建议统一"。

advisors:
  - name: Domain
    enabled: true
    # tools 省略时默认就是 read/grep/glob，这里不重复声明。
    instructions: |
      只审 ZCode 域约束与 agent 规范自洽，不审语法、不审运行期性能（那是 Architecture / Runtime 的活）。
      重点：
      - AGENTS.md 是否退化成文档：超 120 行、复制了 clippy 能管的规则、粘了代码块
      - 反引号路径不存在且未标 (planned)
      - 同一约定在 AGENTS.md / RULES.md / rules/* 里出现两份措辞不同的副本
        （其中 AGENTS.md 与 RULES.md 重复会触发去重、让 RULES 那条静默失效）
      - 出现没有 omp 文档依据的 frontmatter 键、settings 键、hook 事件名
      - 项目 config.yml 写了数组键，会整表覆盖用户级配置
      只在能指出具体文件与行号时发言。规范会失效的用 concern；会静默失效（如 RULES.md 被去重丢弃）的用 blocker。
