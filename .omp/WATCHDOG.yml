# 项目级 advisor 名册。与用户级 ~/.omp/agent/WATCHDOG.yml 一起加载：
# 同名 advisor 由项目覆盖用户，不同名则并存。这里刻意用新名字 Domain，
# 保留用户已有的 Architecture / Runtime 视角，只补它们按 instructions 明确不管的那块。
#
# 需要 advisor.enabled: true（当前由用户级 config.yml 提供，本项目不重复设置）。
# 未配置 model 时走 modelRoles.advisor，避免把别人没有的模型 id 写死进仓库。

instructions: |
  说"已验证"必须附带跑了什么命令、看到什么输出；两者对不上就是虚假验证。
  规范类问题按「哪一份文件该负责」给结论，不要泛泛说"建议统一"。

advisors:
  - name: Domain
    enabled: true
    # tools 省略时默认就是 read/grep/glob，这里不重复声明。
    instructions: |
      只审 ZCode 域约束与 agent 规范自洽：不审语法、不审运行期性能（那是 Architecture / Runtime 的活）。
      关注点清单在 `.omp/WATCHDOG.md`，已附在本 prompt 里，不在这里重列 —— 两处各写一份会分叉。
      你的判据边界：
      - 规范侧看**自洽**（索引 / RULES / rules 三者是否冲突或静默失效），不看文笔；
      - 代码侧只看**域约束**（AGENTS.md 与 rule://zcode-architecture 记着的坑），不看能被 clippy 抓的东西。
      只在能指出具体文件与行号时发言。
      规范会失效的用 concern；会静默失效（如 RULES.md 条目被去重丢弃）的用 blocker。
